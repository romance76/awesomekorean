name: Scrape Market Listings (중고장터 eBay 수집)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'true면 DB에 저장하지 않고 결과만 출력'
        required: false
        default: 'false'

jobs:
  scrape:
    name: Run market:scrape on server
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Run market:scrape via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 25m
          script: |
            set -e
            cd /var/www/awesomekorean
            DRY_RUN="${{ github.event.inputs.dry_run }}"
            CMD="php8.2 artisan market:scrape"
            if [ "$DRY_RUN" = "true" ]; then
              CMD="$CMD --dry-run"
            fi
            eval "$CMD"
