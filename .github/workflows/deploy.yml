name: Deploy to Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# 같은 디렉토리에 두 배포가 동시에 SSH로 붙어 git reset/npm build/
# php-fpm restart를 겹쳐 실행하면 서버가 일관되지 않은 상태로 남을 수
# 있음(실제로 겹쳐 실행된 사례 발견). 새 푸시가 들어오면 진행 중인 배포
# 뒤에 줄을 세워 순차 실행되도록 강제.
concurrency:
  group: deploy-awesomekorean
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to awesomekorean.com
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # 주의: frontend 빌드는 서버에서 수행합니다.
    # GitHub Actions runner 에는 .env(VITE_REVERB_APP_KEY 등)가 없어서
    # 여기서 build 하면 Pusher/Reverb 키가 비어있는 번들이 만들어지고
    # Vue 앱 전체가 로드되지 않는 문제가 있었습니다.
    # deploy.sh 가 서버의 .env 를 읽어서 올바르게 빌드합니다.
    steps:
      - name: Deploy via SSH (server builds with proper .env)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 20m
          script: |
            set -e
            cd /var/www/awesomekorean
            bash deploy.sh
            echo "Deployed successfully to awesomekorean.com!"
