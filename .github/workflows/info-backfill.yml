name: Backfill Info Posts (정보 탭 기존 글 이전)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'true면 DB에 저장하지 않고 결과만 출력'
        required: false
        default: 'false'

jobs:
  backfill:
    name: Run info:backfill on server
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Run info:backfill via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 25m
          script: |
            set -e
            cd /var/www/awesomekorean
            DRY_RUN="${{ github.event.inputs.dry_run }}"
            CMD="php8.2 artisan info:backfill"
            if [ "$DRY_RUN" = "true" ]; then
              CMD="$CMD --dry-run"
            fi
            eval "$CMD"
