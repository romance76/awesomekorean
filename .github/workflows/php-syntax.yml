name: PHP Syntax Check

# 2026-10-21: 푸시할 때마다 자동으로 돌며 실패 메일이 계속 와서(운영자 요청) 자동 실행을 껐다.
#  - 지금은 사람이 직접 돌릴 때만 실행(GitHub › Actions › PHP Syntax Check › Run workflow). 다시 자동으로 돌리려면 아래 주석(#)을 풀면 된다.
#  - 문법 확인은 푸시 전에 직접 하는 방식으로 대신한다. 배포(deploy.yml)는 이 검사와 별개라 그대로 돈다.
on:
  workflow_dispatch:
  # push:
  #   branches: [main, master, develop]
  # pull_request:
  #   branches: [main, master, develop]

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    name: PHP 8.2 Syntax Check (app/)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: PHP Syntax Check (app/)
        run: |
          ERRORS=0
          while IFS= read -r file; do
            if ! php -l "$file" > /dev/null 2>&1; then
              echo "❌ Syntax error in: $file"
              php -l "$file"
              ERRORS=$((ERRORS + 1))
            fi
          done < <(find app -type f -name "*.php")

          if [ "$ERRORS" -gt 0 ]; then
            echo "::error::Found $ERRORS PHP syntax error(s) in app/"
            exit 1
          fi
          echo "✅ All PHP files in app/ passed syntax check"

      - name: PHP Syntax Check (routes/, config/)
        run: |
          ERRORS=0
          for dir in routes config; do
            while IFS= read -r file; do
              if ! php -l "$file" > /dev/null 2>&1; then
                echo "❌ Syntax error in: $file"
                php -l "$file"
                ERRORS=$((ERRORS + 1))
              fi
            done < <(find "$dir" -type f -name "*.php" 2>/dev/null)
          done

          if [ "$ERRORS" -gt 0 ]; then
            echo "::error::Found $ERRORS PHP syntax error(s) in routes/ or config/"
            exit 1
          fi
          echo "✅ routes/ and config/ passed syntax check"

      - name: PHP Syntax Check (database/, bootstrap/)
        run: |
          ERRORS=0
          for dir in database bootstrap; do
            while IFS= read -r file; do
              if ! php -l "$file" > /dev/null 2>&1; then
                echo "❌ Syntax error in: $file"
                php -l "$file"
                ERRORS=$((ERRORS + 1))
              fi
            done < <(find "$dir" -type f -name "*.php" 2>/dev/null)
          done

          if [ "$ERRORS" -gt 0 ]; then
            echo "::error::Found $ERRORS PHP syntax error(s) in database/ or bootstrap/"
            exit 1
          fi
          echo "✅ database/ and bootstrap/ passed syntax check"

  # 프런트 빌드가 깨지는 변경(문법·import 오류)을 배포 전에 잡는다. 배포 서버는 건드리지 않고 러너에서 컴파일만 확인한다.
  frontend-build:
    runs-on: ubuntu-latest
    name: Frontend build check (vite)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      # 화면(SPA) 라우터의 최상위 주소와 서버의 404 판단 목록(SeoHead::SPA_SEGMENTS)이 같은지 — 어긋나면 새 화면이 404 상태로 내려가 검색에 안 잡힘
      - name: SPA route list matches the server
        run: node qa/scripts/check_spa_segments.cjs

      - name: Vite build (check only)
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          VITE_OUT_DIR: ${{ runner.temp }}/vite-check
        run: npm run build
