name: Server security check (read-only)

# 서버 보안 상태를 읽기만 한다(설정 변경 없음). 비밀번호/키 값은 출력하지 않고, .env 는 안전한 설정 이름만 본다.
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/server-security-check.yml' ]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read-only security report
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 3m
          script: |
            APP=/var/www/awesomekorean
            echo "== OS / uptime =="; (lsb_release -ds; uname -r; uptime -p) 2>/dev/null
            echo "== pending security updates =="; (apt list --upgradable 2>/dev/null | grep -i security | wc -l) ; (apt list --upgradable 2>/dev/null | wc -l)
            echo "== reboot required? =="; ls /var/run/reboot-required 2>/dev/null || echo no
            echo "== unattended-upgrades =="; systemctl is-enabled unattended-upgrades 2>&1 | head -1; systemctl is-active unattended-upgrades 2>&1 | head -1
            echo "== listening ports (non-local) =="; ss -lntu 2>/dev/null | awk 'NR==1 || $5 !~ /^(127\.|\[::1\])/' | awk '{print $1, $5}' | sort -u | head -40
            echo "== ufw =="; ufw status verbose 2>&1 | head -30
            echo "== fail2ban =="; systemctl is-active fail2ban 2>&1 | head -1; (fail2ban-client status 2>&1 | head -8)
            echo "== ssh config =="; sshd -T 2>/dev/null | grep -E '^(permitrootlogin|passwordauthentication|pubkeyauthentication|maxauthtries|port) ' 
            echo "== recent failed ssh logins (24h) =="; (journalctl -u ssh --since '24 hours ago' --no-pager 2>/dev/null | grep -c 'Failed password') || echo n/a
            echo "== mysql bind =="; (grep -rhE '^\s*bind-address' /etc/mysql/ 2>/dev/null | head -3); ss -lnt 2>/dev/null | grep -E ':3306\b' | awk '{print $4}'
            echo "== redis bind =="; ss -lnt 2>/dev/null | grep -E ':6379\b' | awk '{print $4}' || true
            echo "== php versions =="; php8.2 -v 2>/dev/null | head -1; php -v 2>/dev/null | head -1
            echo "== php.ini key flags (fpm) =="; for f in /etc/php/8.2/fpm/php.ini; do grep -E '^(expose_php|display_errors|allow_url_include|allow_url_fopen|disable_functions|session\.cookie_secure|session\.cookie_httponly|upload_max_filesize|post_max_size)\s*=' $f 2>/dev/null; done
            echo "== nginx =="; nginx -v 2>&1; (nginx -T 2>/dev/null | grep -nE 'server_tokens|add_header|client_max_body_size|ssl_protocols|limit_req|limit_conn|gzip |location ~ /\.|deny all|fastcgi_pass|root |server_name|listen ' | head -60)
            echo "== tls cert expiry =="; (echo | openssl s_client -servername awesomekorean.com -connect 127.0.0.1:443 2>/dev/null | openssl x509 -noout -enddate 2>/dev/null) || true
            echo "== .env safe flags =="; grep -E '^(APP_ENV|APP_DEBUG|APP_URL|LOG_LEVEL|LOG_CHANNEL|SESSION_DRIVER|SESSION_SECURE_COOKIE|SESSION_LIFETIME|CACHE_STORE|QUEUE_CONNECTION|BROADCAST_CONNECTION|JWT_TTL|JWT_REFRESH_TTL|MAIL_MAILER|DB_HOST|REVERB_HOST|REVERB_SCHEME)=' $APP/.env | sed -E 's/^(APP_KEY|JWT_SECRET)=.*/\1=***/'
            echo "== .env secrets present (names only) =="; grep -cE '^(APP_KEY|JWT_SECRET)=.+' $APP/.env
            echo "== file perms =="; stat -c '%A %U:%G %n' $APP/.env $APP/storage $APP/bootstrap/cache $APP/public $APP/storage/app/firebase-service-account.json 2>/dev/null
            echo "== world-writable files under app (excluding storage/cache/node_modules/vendor) =="; find $APP -xdev -type f -perm -0002 -not -path '*/node_modules/*' -not -path '*/vendor/*' -not -path '*/storage/*' -not -path '*/.git/*' 2>/dev/null | head -10
            echo "== php files inside uploads (should be none) =="; find $APP/storage/app/public $APP/public/storage -xdev -type f \( -name '*.php' -o -name '*.phtml' -o -name '*.phar' -o -name '*.sh' \) 2>/dev/null | head -10
            echo "== recently modified php under public (24h) =="; find $APP/public -xdev -name '*.php' -mtime -1 2>/dev/null | head -10
            echo "== laravel.log recent errors count (today) =="; (grep -c "$(date +%Y-%m-%d).*ERROR" $APP/storage/logs/laravel.log 2>/dev/null) || echo n/a
            echo "== top client IPs hitting login (nginx access, last 2000 lines) =="; (tail -2000 /var/log/nginx/access.log 2>/dev/null | grep -E 'POST /api/(login|register|forgot)' | awk '{print $1}' | sort | uniq -c | sort -rn | head -5)
            echo "== suspicious requests in nginx log (last 5000 lines) =="; (tail -5000 /var/log/nginx/access.log 2>/dev/null | grep -ciE 'wp-login|\.env|phpmyadmin|/\.git|eval\(|union.*select|\.\./|<script') 
            echo "== composer audit =="; (cd $APP && timeout 60 composer audit --no-interaction 2>&1 | tail -15)
